groups:
  - name: crawl-r5
    rules:
      - alert: CrawlTelemetryArchiveDelayed
        expr: max(m1_oldest_unarchived_seconds{state="UNARCHIVED"}) > 600
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 采集统计归档延迟
          description: 统计事件保留在 PostgreSQL，请检查 Kafka 和 ClickHouse 消费服务。
      - alert: CrawlFailureEvidenceDelayed
        expr: max(m1_failure_evidence{state="PENDING"}) > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 采集失败证据待保留
          description: 请检查 MinIO 对象、完整性和证据保留服务。
