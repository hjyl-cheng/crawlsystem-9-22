apiVersion: v1
kind: Secret
metadata:
  name: k3s-etcd-snapshot-s3-config
  namespace: kube-system
type: etcd.k3s.cattle.io/s3-config-secret
stringData:
  etcd-s3-endpoint: "REPLACE_ENDPOINT_HOST_NO_SCHEME"
  etcd-s3-access-key: "REPLACE_ACCESS_KEY"
  etcd-s3-secret-key: "REPLACE_SECRET_KEY"
  etcd-s3-bucket: "REPLACE_BUCKET"
  etcd-s3-region: "REPLACE_REGION"
  etcd-s3-folder: "k3s-etcd"
