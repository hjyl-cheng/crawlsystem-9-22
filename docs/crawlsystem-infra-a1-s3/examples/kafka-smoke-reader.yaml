apiVersion: v1
kind: Pod
metadata:
  name: infra-kafka-reader
  namespace: kafka
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: a1
  containers:
  - name: reader
    image: quay.io/strimzi/kafka:1.2.0-kafka-4.3.1
    command:
    - /opt/kafka/bin/kafka-console-consumer.sh
    args:
    - --bootstrap-server
    - crawler-kafka-kafka-bootstrap.kafka.svc.cluster.local:9093
    - --command-config
    - /etc/client/client.properties
    - --group
    - infra-smoke
    - --topic
    - infra.outbox.events
    - --from-beginning
    - --formatter-property
    - print.key=true
    - --formatter-property
    - print.headers=true
    - --max-messages
    - '1'
    - --timeout-ms
    - '60000'
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 384Mi
    volumeMounts:
    - name: client
      mountPath: /etc/client
      readOnly: true
    - name: ca
      mountPath: /etc/kafka-ca
      readOnly: true
  volumes:
  - name: client
    secret:
      secretName: infra-reader-config
  - name: ca
    secret:
      secretName: crawler-kafka-cluster-ca-cert
