server:
  enabled: true
  image:
    repository: temporalio/server
    tag: 1.32.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  nodeSelector:
    kubernetes.io/hostname: a1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 600m
      memory: 512Mi
  additionalVolumes: &id001
  - name: pg-ca
    configMap:
      name: pg-ca
  # Public JWKS for namespace authorization; only Control holds the private key.
  - name: temporal-jwks
    configMap:
      name: temporal-jwks
  additionalVolumeMounts: &id002
  - name: pg-ca
    mountPath: /etc/pg-ca
    readOnly: true
  - name: temporal-jwks
    mountPath: /etc/temporal/jwks
    readOnly: true
  tls:
    internode:
      enabled: true
      secretName: temporal-internode-tls
      requireClientAuth: true
      serverName: temporal-internode.temporal.svc
    frontend:
      enabled: true
      secretName: temporal-frontend-tls
      requireClientAuth: true
      serverName: temporal-frontend.temporal.svc.cluster.local
  config:
    logLevel: info
    # Namespace authorization (2026-09-24): clients on the public frontend must present
    # a JWT whose `permissions` claim names the namespace, e.g. crawlsystem-m1-main:write.
    # Server components, admin tools and the UI use the internal-frontend, reachable
    # only from the temporal namespace (NetworkPolicy temporal-internal).
    authorization:
      jwtKeyProvider:
        keySourceURIs:
        - file:///etc/temporal/jwks/jwks.json
        refreshInterval: 1m
      permissionsClaimName: permissions
      authorizer: default
      claimMapper: default
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: crawler-pg-rw.db.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal_svc
            existingSecret: temporal-db
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: 1h
            tls:
              enabled: true
              caFile: /etc/pg-ca/ca.crt
              serverName: crawler-pg-rw.db.svc.cluster.local
              enableHostVerification: true
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: crawler-pg-rw.db.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal_svc
            existingSecret: temporal-db
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: 1h
            tls:
              enabled: true
              caFile: /etc/pg-ca/ca.crt
              serverName: crawler-pg-rw.db.svc.cluster.local
              enableHostVerification: true
    namespaces:
      create: true
      namespace:
      - name: crawlsystem
        retention: 7d
  internal-frontend:
    enabled: true
admintools:
  enabled: true
  image:
    repository: temporalio/admin-tools
    tag: 1.32.0
  nodeSelector:
    kubernetes.io/hostname: a1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  additionalVolumes: *id001
  additionalVolumeMounts: *id002
web:
  enabled: true
  image:
    repository: temporalio/ui
    tag: 2.54.1
  nodeSelector:
    kubernetes.io/hostname: a1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8080
  # The UI has no per-user JWT, so it reads through the internal-frontend (cluster-only).
  temporalAddress: temporal-internal-frontend.temporal.svc:7236
  tls:
    enabled: true
    secretName: temporal-ui-client-tls
    serverName: temporal-internode.temporal.svc
    enableHostVerification: true
schema:
  useHelmHooks: true
  backoffLimit: 3
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
