server:
  enabled: true
  image:
    repository: temporalio/server
    tag: 1.32.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  nodeSelector:
    kubernetes.io/hostname: a1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 600m
      memory: 512Mi
  additionalVolumes: &id001
  - name: pg-ca
    configMap:
      name: pg-ca
  additionalVolumeMounts: &id002
  - name: pg-ca
    mountPath: /etc/pg-ca
    readOnly: true
  tls:
    internode:
      enabled: true
      secretName: temporal-internode-tls
      requireClientAuth: true
      serverName: temporal-internode.temporal.svc
    frontend:
      enabled: true
      secretName: temporal-frontend-tls
      requireClientAuth: true
      serverName: temporal-frontend.temporal.svc.cluster.local
  config:
    logLevel: info
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: crawler-pg-rw.db.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal_svc
            existingSecret: temporal-db
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: 1h
            tls:
              enabled: true
              caFile: /etc/pg-ca/ca.crt
              serverName: crawler-pg-rw.db.svc.cluster.local
              enableHostVerification: true
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: crawler-pg-rw.db.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal_svc
            existingSecret: temporal-db
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: 1h
            tls:
              enabled: true
              caFile: /etc/pg-ca/ca.crt
              serverName: crawler-pg-rw.db.svc.cluster.local
              enableHostVerification: true
    namespaces:
      create: true
      namespace:
      - name: crawlsystem
        retention: 7d
admintools:
  enabled: true
  image:
    repository: temporalio/admin-tools
    tag: 1.32.0
  nodeSelector:
    kubernetes.io/hostname: a1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  additionalVolumes: *id001
  additionalVolumeMounts: *id002
web:
  enabled: true
  image:
    repository: temporalio/ui
    tag: 2.54.1
  nodeSelector:
    kubernetes.io/hostname: a1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8080
  tls:
    enabled: true
    secretName: temporal-ui-client-tls
    serverName: temporal-frontend.temporal.svc.cluster.local
    enableHostVerification: true
schema:
  useHelmHooks: true
  backoffLimit: 3
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
