# Business topics and users of the collection pipeline (plan R1, 2026-10-09; generated from one
# table, see the plan document section 0.3c). Messages carry references and parsed facts only:
# raw responses and comment bodies stay in MinIO. Retention is bounded by time and by bytes per
# partition (each broker holds every partition, RF 3). Keys are channel IDs, so one channel's
# messages stay ordered. Client credentials: scripts/configure-crawl-kafka-clients.py.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: crawl-raw
  namespace: kafka
  labels:
    strimzi.io/cluster: crawler-kafka
spec:
  # one message per raw response stored in MinIO (reference only)
  topicName: crawl.raw
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: 2
    cleanup.policy: delete
    retention.ms: 259200000
    retention.bytes: 268435456
    segment.bytes: 33554432
    segment.ms: 3600000
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: crawl-step
  namespace: kafka
  labels:
    strimzi.io/cluster: crawler-kafka
spec:
  # a collection step finished: its manifest of MinIO objects
  topicName: crawl.step
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: 2
    cleanup.policy: delete
    retention.ms: 259200000
    retention.bytes: 67108864
    segment.bytes: 33554432
    segment.ms: 3600000
---
