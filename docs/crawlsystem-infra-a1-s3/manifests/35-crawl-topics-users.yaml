  namespace: kafka
  labels:
    strimzi.io/cluster: crawler-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - resource: { type: cluster }
      operations: [IdempotentWrite]
      host: '*'
    - resource: { type: topic, name: crawl.raw, patternType: literal }
      operations: [Read, Describe]
      host: '*'
    - resource: { type: topic, name: facts.channel, patternType: literal }
      operations: [Write, Describe]
      host: '*'
    - resource: { type: topic, name: facts.video, patternType: literal }
      operations: [Write, Describe]
      host: '*'
    - resource: { type: topic, name: facts.observation, patternType: literal }
      operations: [Write, Describe]
      host: '*'
    - resource: { type: topic, name: facts.agent, patternType: literal }
      operations: [Write, Describe]
      host: '*'
    - resource: { type: topic, name: dlq.parse, patternType: literal }
      operations: [Write, Describe]
      host: '*'
    - resource: { type: topic, name: ops.events, patternType: literal }
      operations: [Write, Describe]
      host: '*'
    - resource: { type: group, name: crawl-parser, patternType: literal }
      operations: [Read]
      host: '*'
---
