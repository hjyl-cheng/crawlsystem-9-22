apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: crawl-worker
  namespace: kafka
  labels:
    strimzi.io/cluster: crawler-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    # Needed by the idempotent producer's InitProducerId request, in addition to topic writes.
    - resource: { type: cluster }
      operations: [IdempotentWrite]
      host: '*'
    - resource: { type: topic, name: crawl.raw, patternType: literal }
      operations: [Write, Describe]
      host: '*'
    - resource: { type: topic, name: crawl.step, patternType: literal }
      operations: [Write, Describe]
      host: '*'
    - resource: { type: topic, name: ops.events, patternType: literal }
      operations: [Write, Describe]
      host: '*'
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
