apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: "logging { level = \"warn\" }\nlocal.file_match \"pods\" {\n  path_targets\
    \ = [{ \"__path__\" = \"/var/log/pods/*/*/*.log\", \"job\" = \"kubernetes-pods\"\
    , \"node\" = sys.env(\"NODE_NAME\") }]\n  sync_period = \"10s\"\n}\nloki.source.file\
    \ \"pods\" {\n  targets = local.file_match.pods.targets\n  forward_to = [loki.process.cri.receiver]\n\
    }\nloki.process \"cri\" {\n  stage.cri {}\n  forward_to = [loki.write.local.receiver]\n\
    }\nloki.write \"local\" {\n  endpoint { url = \"http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push\"\
    \ }\n}\n"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      automountServiceAccountToken: false
      tolerations:
      - operator: Exists
      containers:
      - name: alloy
        image: grafana/alloy:v1.19.2
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/var/lib/alloy
        - --server.http.listen-addr=127.0.0.1:12345
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 160Mi
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: logs
          mountPath: /var/log/pods
          readOnly: true
        - name: position
          mountPath: /var/lib/alloy
        - name: config
          mountPath: /etc/alloy
          readOnly: true
      volumes:
      - name: logs
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: position
        hostPath:
          path: /var/lib/crawl-alloy
          type: DirectoryOrCreate
      - name: config
        configMap:
          name: alloy-config
