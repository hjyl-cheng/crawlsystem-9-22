apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-allowed
  namespace: db
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: db
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: temporal
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kafka
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: control
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingest
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: db
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9187
---
