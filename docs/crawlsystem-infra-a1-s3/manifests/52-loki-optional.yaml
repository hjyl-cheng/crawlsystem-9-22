apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: "auth_enabled: false\nserver:\n  http_listen_port: 3100\ncommon:\n  instance_addr:\
    \ 127.0.0.1\n  path_prefix: /loki\n  storage:\n    filesystem:\n      chunks_directory:\
    \ /loki/chunks\n      rules_directory: /loki/rules\n  replication_factor: 1\n\
    \  ring:\n    kvstore:\n      store: inmemory\nschema_config:\n  configs:\n  -\
    \ from: '2026-01-01'\n    store: tsdb\n    object_store: filesystem\n    schema:\
    \ v13\n    index:\n      prefix: index_\n      period: 24h\ncompactor:\n  working_directory:\
    \ /loki/compactor\n  retention_enabled: true\n  delete_request_store: filesystem\n\
    limits_config:\n  retention_period: 72h\n  ingestion_rate_mb: 0.02\n  ingestion_burst_size_mb:\
    \ 1\n  max_query_parallelism: 2\nanalytics:\n  reporting_enabled: false\n"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: monitoring
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: crawl-loki-local
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: a2
      containers:
      - name: loki
        image: grafana/loki:3.7.8
        args:
        - -config.file=/etc/loki/loki.yaml
        ports:
        - name: http
          containerPort: 3100
        startupProbe:
          httpGet:
            path: /ready
            port: 3100
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /loki
        - name: config
          mountPath: /etc/loki
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: loki-data
      - name: config
        configMap:
          name: loki-config
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
