# Temporal execution Worker. A StatefulSet gives stable Pod names, which are the
# Worker identities shown in the console. The Pod has no PG credentials and no
# signing key: it exchanges a kubelet-rotated, audience-bound ServiceAccount
# token at Control for a 15-minute API token (subject = Pod name).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: execution-worker
  namespace: crawler
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: execution-worker
  namespace: crawler
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: execution-worker }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: execution-worker
  namespace: crawler
  labels: { app.kubernetes.io/name: execution-worker }
spec:
  serviceName: execution-worker
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app.kubernetes.io/name: execution-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: execution-worker }
    spec:
      serviceAccountName: execution-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Worker drain (WORKER_DRAIN_MS) + SDK force window.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: docker.io/crawlsystem/execution-worker:IMAGE_TAG
          imagePullPolicy: Never
          command: ["node", "/app/worker/src/main.mjs"]
          env:
            - name: WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: SERVER_ID
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - { name: BUILD_VERSION, value: "BUILD_REVISION" }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=256" }
            - { name: WORKER_CAPACITY, value: "2" }
            - { name: CONTROL_API_URL, value: "http://control-api-preview.control.svc.cluster.local:18100" }
            - { name: INGEST_API_URL, value: "http://ingest-preview.ingest.svc.cluster.local:18101" }
            - { name: WORKLOAD_IDENTITY_TOKEN_FILE, value: /var/run/secrets/crawlsystem/control-token }
            # Same projected token also yields the Temporal token (crawlsystem-m1-main:write).
            - { name: TEMPORAL_API_KEY_MODE, value: workload }
            # Real YouTube collection: node-local proxy leases and the Data API key.
            - { name: PROXY_MANAGER_URL, value: "http://proxy-manager.crawler.svc.cluster.local:18110" }
            - { name: YOUTUBE_DATA_API_KEY_FILE, value: /youtube/key }
            - { name: YOUTUBE_COLLECTION_MODE, value: web }
            - { name: FINGERPRINT_GATEWAY_URL, value: "http://127.0.0.1:3099" }
            - { name: BROWSER_IDENTITY_DIR, value: /browser-state }
            - { name: BROWSER_IDENTITY_KEY_FILE, value: /browser-key/key }
            - { name: MINIO_ENDPOINT, value: "http://minio.storage.svc.cluster.local:9000" }
            - { name: MINIO_CREDENTIAL_DIR, value: /minio }
            - { name: KAFKA_CREDENTIAL_DIR, value: /kafka }
            # REQUIRED_EGRESS_COUNTRY remains unset: pt-BR/BR identity, any existing qualified egress.
            - { name: QUERY_RUNNER_SLOTS, value: "0" }
            # AGENT domain: local-model profiling of the collected facts.
            - { name: PROFILE_AGENT_URL, value: "http://profile-agent.crawler.svc.cluster.local:18120" }
            - { name: TEMPORAL_ADDRESS, value: "temporal-frontend.temporal.svc.cluster.local:7233" }
            - { name: TEMPORAL_NAMESPACE, value: crawlsystem-m1-main }
            - { name: TEMPORAL_TASK_QUEUE, value: crawlsystem-m1-main }
            - { name: TEMPORAL_TLS_SERVER_NAME, value: temporal-frontend.temporal.svc.cluster.local }
            - { name: TEMPORAL_TLS_CA_FILE, value: /temporal/ca.crt }
            - { name: TEMPORAL_TLS_CERT_FILE, value: /temporal/tls.crt }
            - { name: TEMPORAL_TLS_KEY_FILE, value: /temporal/tls.key }
          volumeMounts:
            - { name: control-token, mountPath: /var/run/secrets/crawlsystem, readOnly: true }
            - { name: temporal, mountPath: /temporal, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: youtube, mountPath: /youtube, readOnly: true }
            - { name: browser-state, mountPath: /browser-state }
            - { name: browser-key, mountPath: /browser-key, readOnly: true }
            - { name: minio, mountPath: /minio, readOnly: true }
            - { name: kafka, mountPath: /kafka, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
        - name: fingerprint-gateway
          image: docker.io/crawlsystem/fingerprint-gateway:FINGERPRINT_TAG
          imagePullPolicy: Never
          command: ["python3", "-m", "fingerprint_gateway.gateway", "--host", "127.0.0.1", "--port", "3099"]
          env:
            - { name: PYTHONPATH, value: /app/src:/app/site }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: PYTHONUNBUFFERED, value: "1" }
          readinessProbe:
            exec: { command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3099/health', timeout=2)"] }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec: { command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3099/health', timeout=2)"] }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: "500m", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: gateway-tmp, mountPath: /tmp }
      volumes:
        - name: control-token
          projected:
            sources:
              - serviceAccountToken: { audience: crawlsystem-control, expirationSeconds: 3600, path: control-token }
        - name: temporal
          secret: { secretName: temporal-client-worker, defaultMode: 0440 }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: youtube
          secret: { secretName: youtube-data-api, defaultMode: 0440, items: [{ key: key, path: key }] }
        - name: browser-state
          persistentVolumeClaim: { claimName: execution-browser-state }
        - name: browser-key
          secret: { secretName: browser-identity-key, defaultMode: 0440 }
        - name: minio
          secret: { secretName: minio-crawl-worker, defaultMode: 0440 }
        - name: kafka
          secret: { secretName: kafka-crawl-worker, defaultMode: 0440 }
        - name: gateway-tmp
          emptyDir: { sizeLimit: 32Mi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: execution-browser-state
  namespace: crawler
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: { storage: 256Mi }
