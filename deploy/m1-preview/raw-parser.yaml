apiVersion: v1
kind: ServiceAccount
metadata: { name: raw-parser, namespace: crawler }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: raw-parser, namespace: crawler }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: raw-parser } }
  template:
    metadata: { labels: { app.kubernetes.io/name: raw-parser } }
    spec:
      serviceAccountName: raw-parser
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: parser
          image: docker.io/crawlsystem/control-api:IMAGE_TAG
          imagePullPolicy: Never
          command: [node, /app/raw-parser.mjs]
          ports: [{ name: http, containerPort: 18103 }]
          env:
            - { name: CONTROL_API_URL, value: "http://control-api-preview.control.svc.cluster.local:18100" }
            - { name: MINIO_URL, value: "http://minio.storage.svc.cluster.local:9000" }
            - { name: MINIO_CREDENTIALS_DIRECTORY, value: /minio }
            - { name: KAFKA_CREDENTIALS_DIRECTORY, value: /kafka }
            - { name: WORKLOAD_TOKEN_FILE, value: /identity/token }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=256" }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: kafka, mountPath: /kafka, readOnly: true }
            - { name: minio, mountPath: /minio, readOnly: true }
            - { name: identity, mountPath: /identity, readOnly: true }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 60, periodSeconds: 20, failureThreshold: 6 }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 500m, memory: 384Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes:
        - name: kafka
          secret: { secretName: kafka-crawl-parser, defaultMode: 0440 }
        - name: minio
          secret: { secretName: minio-crawl-parser, defaultMode: 0440 }
        - name: identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: { audience: crawlsystem-control, expirationSeconds: 3600, path: token }
