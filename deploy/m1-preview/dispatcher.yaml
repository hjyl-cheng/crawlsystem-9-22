# Durable START/CANCEL intent dispatcher. Intents are leased in PostgreSQL, so a
# restart (or a second replica) resumes safely; Recreate keeps one in normal use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intent-dispatcher
  namespace: control
  labels: { app.kubernetes.io/name: intent-dispatcher }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: intent-dispatcher }
  template:
    metadata:
      labels: { app.kubernetes.io/name: intent-dispatcher }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dispatcher
          image: docker.io/crawlsystem/control-api:IMAGE_TAG
          imagePullPolicy: Never
          command: ["node", "/app/dispatcher.mjs"]
          env:
            - { name: PG_POOL_MAX, value: "1" }
            - { name: M1_WORKSPACE_ID, value: "m1-main" }
            - { name: PG_CA_FILE, value: /secrets/pg-ca.crt }
            - { name: PG_TLS_SERVERNAME, value: crawler-pg-pool.db.svc.cluster.local }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: control-api-preview, key: database-url } }
            - { name: TEMPORAL_ADDRESS, value: "temporal-frontend.temporal.svc.cluster.local:7233" }
            - { name: TEMPORAL_NAMESPACE, value: crawlsystem-m1-main }
            - { name: TEMPORAL_TASK_QUEUE, value: crawlsystem-m1-main }
            - { name: TEMPORAL_TLS_SERVER_NAME, value: temporal-frontend.temporal.svc.cluster.local }
            - { name: TEMPORAL_TLS_CA_FILE, value: /temporal/ca.crt }
            - { name: TEMPORAL_TLS_CERT_FILE, value: /temporal/tls.crt }
            - { name: TEMPORAL_TLS_KEY_FILE, value: /temporal/tls.key }
            - { name: DISPATCHER_ALIVE_FILE, value: /tmp/alive }
          livenessProbe:
            exec: { command: ["sh", "-c", "test $(( $(date +%s) - $(stat -c %Y /tmp/alive) )) -lt 60"] }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - { name: secrets, mountPath: /secrets, readOnly: true }
            - { name: temporal, mountPath: /temporal, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 300m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: secrets
          secret:
            secretName: control-api-preview
            defaultMode: 0440
            items: [{ key: pg-ca.crt, path: pg-ca.crt }]
        - name: temporal
          secret: { secretName: temporal-client-dispatcher, defaultMode: 0440 }
        - name: tmp
          emptyDir: { sizeLimit: 1Mi }
