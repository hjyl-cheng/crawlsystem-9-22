apiVersion: v1
kind: ServiceAccount
metadata: {name: crawl-analytics, namespace: analytics}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: crawl-analytics, namespace: analytics}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: crawl-analytics}}
  template:
    metadata: {labels: {app.kubernetes.io/name: crawl-analytics}}
    spec:
      serviceAccountName: crawl-analytics
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: analytics
          image: docker.io/crawlsystem/control-api:IMAGE_TAG
          imagePullPolicy: Never
          command: [node, /app/analytics.mjs]
          ports: [{name: http, containerPort: 18103}]
          env:
            - {name: CONTROL_API_URL, value: "http://control-api-preview.control.svc.cluster.local:18100"}
            - {name: WORKLOAD_TOKEN_FILE, value: /identity/token}
            - {name: KAFKA_CREDENTIALS_DIRECTORY, value: /kafka}
            - {name: CLICKHOUSE_CREDENTIALS_DIRECTORY, value: /clickhouse}
            - {name: MINIO_CREDENTIALS_DIRECTORY, value: /minio}
            - {name: NODE_OPTIONS, value: "--max-old-space-size=256"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          volumeMounts:
            - {name: identity, mountPath: /identity, readOnly: true}
            - {name: kafka, mountPath: /kafka, readOnly: true}
            - {name: clickhouse, mountPath: /clickhouse, readOnly: true}
            - {name: minio, mountPath: /minio, readOnly: true}
          readinessProbe: {httpGet: {path: /healthz, port: http},periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http},initialDelaySeconds: 90,periodSeconds: 20,failureThreshold: 6}
          resources: {requests: {cpu: 50m,memory: 96Mi},limits: {cpu: 500m,memory: 384Mi}}
          securityContext: {allowPrivilegeEscalation: false,readOnlyRootFilesystem: true,capabilities: {drop: [ALL]}}
      volumes:
        - name: identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {audience: crawlsystem-control,expirationSeconds: 3600,path: token}
        - name: kafka
          secret: {secretName: kafka-crawl-sink-ch,defaultMode: 0440}
        - name: clickhouse
          secret: {secretName: clickhouse-r5,defaultMode: 0440}
        - name: minio
          secret: {secretName: minio-crawl-analytics,defaultMode: 0440}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: control-api-preview-from-analytics,namespace: control}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: control-api-preview}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: analytics}}
          podSelector: {matchLabels: {app.kubernetes.io/name: crawl-analytics}}
      ports: [{port: 18100}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: minio-from-crawl-analytics,namespace: storage}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: minio}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: analytics}}
          podSelector: {matchLabels: {app.kubernetes.io/name: crawl-analytics}}
      ports: [{port: 9000}]
