apiVersion: v1
kind: ServiceAccount
metadata: { name: pg-sink, namespace: ingest }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pg-sink, namespace: ingest }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: pg-sink } }
  template:
    metadata: { labels: { app.kubernetes.io/name: pg-sink } }
    spec:
      serviceAccountName: pg-sink
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: sink
          image: docker.io/crawlsystem/control-api:IMAGE_TAG
          imagePullPolicy: Never
          command: [node, /app/pg-sink.mjs]
          ports: [{ name: http, containerPort: 18103 }]
          env:
            - { name: CONTROL_API_URL, value: "http://control-api-preview.control.svc.cluster.local:18100" }
            - { name: KAFKA_CREDENTIALS_DIRECTORY, value: /kafka }
            - { name: WORKLOAD_TOKEN_FILE, value: /identity/token }
            - { name: PG_POOL_MAX, value: "2" }
            - { name: PG_CA_FILE, value: /pg/pg-ca.crt }
            - { name: PG_TLS_SERVERNAME, value: crawler-pg-pool.db.svc.cluster.local }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: pipeline-pg-sink, key: database-url } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: kafka, mountPath: /kafka, readOnly: true }
            - { name: pg, mountPath: /pg, readOnly: true }
            - { name: identity, mountPath: /identity, readOnly: true }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 60, periodSeconds: 20, failureThreshold: 6 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes:
        - name: kafka
          secret: { secretName: kafka-crawl-sink-pg, defaultMode: 0440 }
        - name: pg
          secret:
            secretName: pipeline-pg-sink
            defaultMode: 0440
            items: [{ key: pg-ca.crt, path: pg-ca.crt }]
        - name: identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: { audience: crawlsystem-control, expirationSeconds: 3600, path: token }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: control-api-preview-from-pipeline, namespace: control }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: control-api-preview } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: crawler } }
          podSelector: { matchLabels: { app.kubernetes.io/name: raw-parser } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingest } }
          podSelector: { matchLabels: { app.kubernetes.io/name: pg-sink } }
      ports: [{ port: 18100 }]
