# Control API for the console preview, running inside the cluster so it reaches
# PgBouncer over the Service network instead of a kubectl port-forward.
#
# The image is built by scripts/dev/build-images.ts and imported into each
# node's containerd (no registry yet), hence imagePullPolicy: Never. Secret
# `control-api-preview` is created from ignored runtime files; see
# apps/control-api/README.md. Apply through scripts/dev/deploy-preview.ts.
#
# Control also exchanges Worker ServiceAccount tokens for short API tokens
# (POST /v1/workload/token), so it runs with its own ServiceAccount that may
# create TokenReviews and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-api
  namespace: control
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crawlsystem-control-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crawlsystem-control-tokenreview
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: crawlsystem-control-tokenreview }
subjects:
  - { kind: ServiceAccount, name: control-api, namespace: control }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api-preview
  namespace: control
  labels: { app.kubernetes.io/name: control-api-preview }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: control-api-preview }
  template:
    metadata:
      labels: { app.kubernetes.io/name: control-api-preview }
    spec:
      serviceAccountName: control-api
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: control-api-preview }
      containers:
        - name: control-api
          image: docker.io/crawlsystem/control-api:IMAGE_TAG
          imagePullPolicy: Never
          command: ["node", "/app/control-api.mjs"]
          ports: [{ name: http, containerPort: 18100 }]
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: CONTROL_PORT, value: "18100" }
            - { name: PG_POOL_MAX, value: "1" }
            - { name: CONSOLE_PG_POOL_MAX, value: "1" }
            - { name: M1_WORKSPACE_ID, value: "m1-main" }
            - { name: TRACE_SAMPLE_RATIO, value: "0.1" }
            - { name: WORKLOAD_SERVICE_ACCOUNT, value: "system:serviceaccount:crawler:execution-worker" }
            - { name: WORKLOAD_TOKEN_AUDIENCE, value: crawlsystem-control }
            - { name: WORKLOAD_TOKEN_SECONDS, value: "900" }
            # Temporal namespace tokens (ES256). Temporal trusts only the public JWKS ConfigMap.
            - { name: TEMPORAL_JWT_KEY_FILE, value: /temporal-jwt/signing.pem }
            - { name: TEMPORAL_TOKEN_SECONDS, value: "900" }
            - name: TEMPORAL_WORKLOAD_PERMISSIONS
              value: '{"system:serviceaccount:crawler:execution-worker":["crawlsystem-m1-main:write"],"system:serviceaccount:control:intent-dispatcher":["crawlsystem-m1-main:write"]}'
            - { name: PG_CA_FILE, value: /secrets/pg-ca.crt }
            - { name: PG_TLS_SERVERNAME, value: crawler-pg-pool.db.svc.cluster.local }
            - { name: M1_JWT_SECRET_FILE, value: /secrets/jwt-secret }
            # The preview gateway validates the public origin, then maps it to this one.
            - { name: CONSOLE_ORIGIN, value: "http://127.0.0.1:18102" }
            - { name: CONSOLE_COOKIE_SECURE, value: "true" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: control-api-preview, key: database-url } }
            - name: CONSOLE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: control-api-preview, key: console-database-url } }
          volumeMounts:
            - { name: secrets, mountPath: /secrets, readOnly: true }
            - { name: temporal-jwt, mountPath: /temporal-jwt, readOnly: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: secrets
          secret:
            secretName: control-api-preview
            defaultMode: 0440
            items:
              - { key: pg-ca.crt, path: pg-ca.crt }
              - { key: jwt-secret, path: jwt-secret }
        - name: temporal-jwt
          secret:
            secretName: temporal-jwt-signing
            defaultMode: 0440
            items: [{ key: signing.pem, path: signing.pem }]
---
apiVersion: v1
kind: Service
metadata:
  name: control-api-preview
  namespace: control
spec:
  selector: { app.kubernetes.io/name: control-api-preview }
  ports: [{ name: http, port: 18100, targetPort: http }]
---
# `control` is default-deny for ingress. Only the A1 host, where the preview
# static server and Cloudflare tunnel run, may reach the API. Host traffic
# arrives from the node address or its flannel/cni0 address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-api-preview-from-a1
  namespace: control
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: control-api-preview }
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.4.4.12/32 }
        - ipBlock: { cidr: 10.42.0.0/32 }
        - ipBlock: { cidr: 10.42.0.1/32 }
      ports: [{ port: 18100 }]
---
# Existing Prometheus reads only the internal metrics endpoint. Business API
# routes continue to require their own authorization.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-api-preview-from-prometheus
  namespace: control
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: control-api-preview }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
          podSelector:
            matchLabels: { app: prometheus }
      ports: [{ port: 18100 }]
---
# Execution Workers read inputs, report heartbeats/events and exchange their
# ServiceAccount token here. Nothing else in `crawler` may reach Control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-api-preview-from-workers
  namespace: control
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: control-api-preview }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: crawler }
          podSelector:
            matchLabels: { app.kubernetes.io/name: execution-worker }
      ports: [{ port: 18100 }]
---
# The dispatcher exchanges its ServiceAccount token here for a Temporal token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-api-preview-from-dispatcher
  namespace: control
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: control-api-preview }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: intent-dispatcher }
      ports: [{ port: 18100 }]
