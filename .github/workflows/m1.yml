name: M1 contracts and PostgreSQL integration
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm run test:auth
      - run: npm run test:http
      - run: npm run test:console
      - run: npm run build:console
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: m1_ci_app
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: crawlsystem_m1_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U m1_ci_app -d crawlsystem_m1_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://m1_ci_app:isolated-ci-only@127.0.0.1:5432/crawlsystem_m1_ci_test
      M1_ALLOW_LOCAL_PG_PLAINTEXT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run test:integration
